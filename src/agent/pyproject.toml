[project]
name = "standin-agent"
version = "0.1.0"
description = "Standin agent service - meeting preflight with avatar agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-github-copilot==1.0.3",
    "agent-framework-orchestrations==1.0.1",
    "fastapi==0.138.0",
    "httpx>=0.27",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.5",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
