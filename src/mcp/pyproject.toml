[project]
name = "standin-mcp"
version = "0.1.0"
description = "Standin MCP server - deterministic domain tools (no LLM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.27,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
